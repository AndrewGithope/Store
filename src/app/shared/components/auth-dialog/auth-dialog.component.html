<div class="dialog-container">
  <h2 mat-dialog-title class="dialog-title">
    <mat-icon class="title-icon">lock</mat-icon> Sign In
  </h2>

  <mat-dialog-content class="dialog-content">
    <form [formGroup]="authForm" (ngSubmit)="onSignIn()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Username</mat-label>
        <input 
          matInput 
          formControlName="username" 
          placeholder="Enter username" 
          autocomplete="username">
        <mat-icon matSuffix>account_circle</mat-icon>
        <mat-error *ngIf="authForm.get('username')?.hasError('required')">
          Username is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input 
          matInput 
          type="password" 
          formControlName="password" 
          placeholder="Enter password" 
          autocomplete="current-password">
        <mat-icon matSuffix>lock_outline</mat-icon>
        <mat-error *ngIf="authForm.get('password')?.hasError('required')">
          Password is required
        </mat-error>
        <mat-error *ngIf="authForm.get('password')?.hasError('minlength')">
          Password must be at least 8 characters
        </mat-error>
      </mat-form-field>

      <mat-dialog-actions align="end" class="dialog-actions">
        <button 
          mat-button 
          type="button" 
          (click)="onCancel()">
          Cancel
        </button>
        <button 
          mat-raised-button 
          color="primary" 
          type="submit"
          [disabled]="authForm.invalid">
          Sign In
        </button>
      </mat-dialog-actions>
    </form>
  </mat-dialog-content>
</div>
